name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff check (rules in pyproject.toml; no warnings allowed)
        run: |
          python -m pip install ruff
          ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install TorchNEP (with ase + dev extras)
        run: pip install .[ase,dev]

      - name: Run tests
        run: pytest -q -n auto      # one worker per core (pytest-xdist)

  coverage:
    # One CPU run with the opt-in multi-process tests switched on (TORCHNEP_TEST_DDP=1), uploaded to Codecov for the
    # README badge. GPU-only code cannot run on these runners; the README states the GPU-inclusive figure measured
    # separately. An editable install keeps the reported paths equal to the repository's.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch and TorchNEP (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[ase,dev]

      - name: Run tests with coverage
        env:
          TORCHNEP_TEST_DDP: "1"
        run: pytest -q -n auto --cov=torchnep --cov-report=xml --cov-report=term

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
