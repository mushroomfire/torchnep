name: publish

# Publishes the package to PyPI when a version tag (e.g. v1.0.1) is pushed,
# then creates the GitHub Release for that tag with the matching section of
# releaseNotes.md as its text and the sdist/wheel attached.
#   git tag v1.0.1 && git push origin v1.0.1
#
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. One-time setup:
# on https://pypi.org/manage/project/torchnep/settings/publishing/ add a
# trusted publisher for this repository, workflow file `publish.yml`,
# environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # GitHub Release page for the tag: the "## <version>" section of
    # releaseNotes.md becomes the release text, dist/* are attached.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes for this version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## / { on = ($2 == ver) ; next }
            on { print }' releaseNotes.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No '## $ver' section in releaseNotes.md" > notes.md
          fi
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"      # a/b/rc suffix -> pre-release
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $([[ "$ver" == *[a-z]* ]] && echo --prerelease || echo --latest)
