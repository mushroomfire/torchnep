name: publish

# Publishes the package to PyPI when a version tag (e.g. v1.0.1) is pushed.
#   git tag v1.0.1 && git push origin v1.0.1
#
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. One-time setup:
# on https://pypi.org/manage/project/torchnep/settings/publishing/ add a
# trusted publisher for this repository, workflow file `publish.yml`,
# environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
