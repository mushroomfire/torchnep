[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "torchnep"
dynamic = ["version"]
description = "PyTorch implementation of NEP (Neuroevolution Potential)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest", "mdapy"]

[tool.setuptools.packages.find]
include = ["torchnep*"]

[tool.setuptools.dynamic]
version = {attr = "torchnep.__version__"}
