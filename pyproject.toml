[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchnep"
dynamic = ["version"]
description = "PyTorch implementation of NEP (Neuroevolution Potential)"
readme = "README.md"
authors = [
    {name = "Yongchao Wu"},
    {email = "yongchao.wu@aalto.fi"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest", "mdapy"]

[project.urls]
Homepage = "https://github.com/mushroomfire/torchnep"
Repository = "https://github.com/mushroomfire/torchnep"
Issues = "https://github.com/mushroomfire/torchnep/issues"

[tool.hatch.version]
path = "torchnep/__init__.py"

# Wheel: install only the torchnep/ package.
[tool.hatch.build.targets.wheel]
packages = ["torchnep"]

# sdist (tar.gz): library code + README + pyproject.toml only.
# tests/, example/, my_test/ are dev-only and never shipped.
[tool.hatch.build.targets.sdist]
include = [
    "torchnep/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    ".gitignore",
    "tests",
    "example",
    "my_test",
    ".github",
]
