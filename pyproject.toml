[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "torchnep"
version = "1.0.0"
description = "PyTorch implementation of NEP (Neuroevolution Potential)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
cuda = ["ninja"]
dev = ["pytest"]

[project.scripts]
torchnep-build = "torchnep.build_ext:main"

[tool.setuptools.packages.find]
include = ["torchnep*"]

[tool.setuptools.package-data]
torchnep = ["csrc/*.cu", "csrc/*.cuh", "csrc/*.h", "csrc/*.cpp"]
