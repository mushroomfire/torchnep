[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchnep"
dynamic = ["version"]
description = "PyTorch implementation of NEP (Neuroevolution Potential)"
readme = "README.md"
authors = [
    {name = "Yongchao Wu"},
    {email = "yongchao.wu@aalto.fi"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest"]
# ASE calculator (torchnep.ase_calculator.NEP) — optional, not needed for
# training or prediction. Install with: pip install torchnep[ase]
ase = ["ase>=3.22"]

[tool.pytest.ini_options]
# The redundant-q_1111 warning is intentional and fires for fixtures / legacy
# l_max forms that enable q_1111; silence it so it doesn't clutter the run.
# test_q1111_redundancy_warns still asserts it fires (via pytest.warns).
filterwarnings = [
    "ignore:.*has_q_1111.*redundant.*:UserWarning",
]

[project.urls]
Homepage = "https://github.com/mushroomfire/torchnep"
Repository = "https://github.com/mushroomfire/torchnep"
Issues = "https://github.com/mushroomfire/torchnep/issues"

[tool.hatch.version]
path = "torchnep/__init__.py"

# Wheel: install only the torchnep/ package.
[tool.hatch.build.targets.wheel]
packages = ["torchnep"]

# sdist (tar.gz): library code + README + pyproject.toml only.
# tests/, example/, my_test/ are dev-only and never shipped.
[tool.hatch.build.targets.sdist]
include = [
    "torchnep/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    ".gitignore",
    "tests",
    "example",
    "my_test",
    ".github",
]
