[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchnep"
dynamic = ["version"]
description = "PyTorch implementation of NEP (Neuroevolution Potential)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest", "mdapy"]

[tool.hatch.version]
path = "torchnep/__init__.py"

# Wheel: install only the torchnep/ package.
[tool.hatch.build.targets.wheel]
packages = ["torchnep"]

# sdist (tar.gz): library code + README + pyproject.toml only.
# tests/, example/, my_test/ are dev-only and never shipped.
[tool.hatch.build.targets.sdist]
include = [
    "torchnep/**/*.py",
    "README.md",
    "pyproject.toml",
]
exclude = [
    ".gitignore",
    "tests",
    "example",
    "my_test",
    ".claude",
    ".github",
]
