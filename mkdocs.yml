site_name: TorchNEP
site_url: https://mushroomfire.github.io/torchnep/
site_description: Train NEP machine-learned interatomic potentials in PyTorch; models run in GPUMD.
site_author: Yongchao Wu
repo_url: https://github.com/mushroomfire/torchnep
repo_name: mushroomfire/torchnep
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2025–2026 Yongchao Wu · GPL-3.0-or-later

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mushroomfire/torchnep
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/torchnep/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Training data: getting-started/training-data.md
  - User guide:
      - nep.in reference: guide/nep-in.md
      - Training: guide/training.md
      - Multi-GPU and multi-node: guide/distributed.md
      - Restart and fine-tuning: guide/restart-finetune.md
      - Prediction: guide/prediction.md
      - ASE calculator: guide/ase.md
      - Plotting: guide/plotting.md
  - Reference:
      - Output files: reference/output-files.md
      - Python API: reference/api.md
      - Source layout: reference/source-layout.md
  - Release notes: release-notes.md
  - Citation: citation.md
